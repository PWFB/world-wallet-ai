name: BALMZ AI APT Android

on:
  pull_request:
    paths:
      - "apps/android-aptido/**"
      - ".github/workflows/balmz-ai-apt-android.yml"
  push:
    branches:
      - main
      - feat/balmz-aptido-android-apk
    tags:
      - "apt-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle -p apps/android-aptido :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: balmz-ai-apt-debug-apk
          path: apps/android-aptido/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-signed-release:
    name: Publish signed public APK
    if: startsWith(github.ref, 'refs/tags/apt-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Require permanent release signing key
        env:
          APTIDO_KEYSTORE_BASE64: ${{ secrets.APTIDO_KEYSTORE_BASE64 }}
          APTIDO_KEYSTORE_PASSWORD: ${{ secrets.APTIDO_KEYSTORE_PASSWORD }}
          APTIDO_KEY_ALIAS: ${{ secrets.APTIDO_KEY_ALIAS }}
          APTIDO_KEY_PASSWORD: ${{ secrets.APTIDO_KEY_PASSWORD }}
        run: |
          test -n "$APTIDO_KEYSTORE_BASE64" || (echo "Missing APTIDO_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$APTIDO_KEYSTORE_PASSWORD" || (echo "Missing APTIDO_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$APTIDO_KEY_ALIAS" || (echo "Missing APTIDO_KEY_ALIAS repository secret" && exit 1)
          test -n "$APTIDO_KEY_PASSWORD" || (echo "Missing APTIDO_KEY_PASSWORD repository secret" && exit 1)
          echo "$APTIDO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aptido-release.jks"

      - name: Build signed release APK
        env:
          APTIDO_KEYSTORE_PATH: ${{ runner.temp }}/aptido-release.jks
          APTIDO_KEYSTORE_PASSWORD: ${{ secrets.APTIDO_KEYSTORE_PASSWORD }}
          APTIDO_KEY_ALIAS: ${{ secrets.APTIDO_KEY_ALIAS }}
          APTIDO_KEY_PASSWORD: ${{ secrets.APTIDO_KEY_PASSWORD }}
        run: gradle -p apps/android-aptido :app:assembleRelease --no-daemon --stacktrace

      - name: Generate APK checksum
        run: sha256sum apps/android-aptido/app/build/outputs/apk/release/app-release.apk > apps/android-aptido/app/build/outputs/apk/release/app-release.apk.sha256

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: BALMZ AI APT ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/android-aptido/app/build/outputs/apk/release/app-release.apk
            apps/android-aptido/app/build/outputs/apk/release/app-release.apk.sha256
