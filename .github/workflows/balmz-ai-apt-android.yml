name: BALMZ AI APT Android

on:
  pull_request:
    paths:
      - "apps/android-aptido/**"
      - ".github/workflows/balmz-ai-apt-android.yml"
  push:
    branches:
      - main
      - feat/balmz-aptido-android-apk
    tags:
      - "apt-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-debug:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37 (target remains 36)
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify Trust Wallet Core package access
        id: walletcore-auth
        env:
          TRUST_WALLET_PACKAGES_TOKEN: ${{ secrets.TRUST_WALLET_PACKAGES_TOKEN }}
        shell: bash
        run: |
          test -n "$TRUST_WALLET_PACKAGES_TOKEN" || (echo "::error::Missing repository secret TRUST_WALLET_PACKAGES_TOKEN in PWFB/world-wallet-ai." && exit 1)
          user_status=$(curl -sS -D "$RUNNER_TEMP/github-user.headers" -o "$RUNNER_TEMP/github-user.json" -w "%{http_code}" -H "Authorization: Bearer $TRUST_WALLET_PACKAGES_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/user)
          if [ "$user_status" != "200" ]; then
            echo "::error::TRUST_WALLET_PACKAGES_TOKEN was rejected by GitHub API (HTTP $user_status). Refresh the classic PAT and save it as the repository secret."
            exit 1
          fi
          token_login=$(USER_JSON="$RUNNER_TEMP/github-user.json" python3 -c 'import json,os; print(json.load(open(os.environ["USER_JSON"]))["login"])')
          echo "GITHUB_USER=$token_login" >> "$GITHUB_ENV"
          echo "GitHub package token authenticated as: $token_login"
          scopes=$(sed -n 's/^[Xx]-[Oo]auth-[Ss]copes:[[:space:]]*//p' "$RUNNER_TEMP/github-user.headers" | tr -d '\\r')
          if [ -z "$scopes" ]; then
            echo "::error::GitHub did not return X-OAuth-Scopes. Verify that TRUST_WALLET_PACKAGES_TOKEN is a classic PAT with read:packages."
            exit 1
          fi
          echo "Classic PAT scopes reported by GitHub: $scopes"
          normalized_scopes=$(printf '%s' "$scopes" | tr -d '[:space:]')
          case ",$normalized_scopes," in
            *,read:packages,*) ;;
            *)
              echo "::error::TRUST_WALLET_PACKAGES_TOKEN is missing the required read:packages scope."
              exit 1
              ;;
          esac
          package_status=$(curl -L -sS -u "$token_login:$TRUST_WALLET_PACKAGES_TOKEN" -o "$RUNNER_TEMP/wallet-core-4.9.3.pom" -w "%{http_code}" "https://maven.pkg.github.com/trustwallet/wallet-core/com/trustwallet/wallet-core/4.9.3/wallet-core-4.9.3.pom")
          echo "Trust Wallet Core 4.9.3 Maven metadata final HTTP status: $package_status"
          if [ "$package_status" != "200" ] || [ ! -s "$RUNNER_TEMP/wallet-core-4.9.3.pom" ] || ! grep -q '<artifactId>wallet-core</artifactId>' "$RUNNER_TEMP/wallet-core-4.9.3.pom" || ! grep -q '<version>4.9.3</version>' "$RUNNER_TEMP/wallet-core-4.9.3.pom"; then
            echo "::error::Could not retrieve the expected Trust Wallet Core 4.9.3 Maven POM. Check read:packages and package/repository read access."
            exit 1
          fi
          echo "Trust Wallet Core 4.9.3 POM downloaded and validated."

      - name: Build debug APK and instrumentation test APK
        env:
          TRUST_WALLET_PACKAGES_TOKEN: ${{ secrets.TRUST_WALLET_PACKAGES_TOKEN }}
        run: gradle -p apps/android-aptido :app:assembleDebug :app:assembleAndroidTest --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: balmz-ai-apt-debug-apk
          path: apps/android-aptido/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-signed-release:
    name: Publish signed public APK
    if: startsWith(github.ref, 'refs/tags/apt-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37 (target remains 36)
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Require permanent release signing key
        env:
          APTIDO_KEYSTORE_BASE64: ${{ secrets.APTIDO_KEYSTORE_BASE64 }}
          APTIDO_KEYSTORE_PASSWORD: ${{ secrets.APTIDO_KEYSTORE_PASSWORD }}
          APTIDO_KEY_ALIAS: ${{ secrets.APTIDO_KEY_ALIAS }}
          APTIDO_KEY_PASSWORD: ${{ secrets.APTIDO_KEY_PASSWORD }}
        run: |
          test -n "$APTIDO_KEYSTORE_BASE64" || (echo "Missing APTIDO_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$APTIDO_KEYSTORE_PASSWORD" || (echo "Missing APTIDO_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$APTIDO_KEY_ALIAS" || (echo "Missing APTIDO_KEY_ALIAS repository secret" && exit 1)
          test -n "$APTIDO_KEY_PASSWORD" || (echo "Missing APTIDO_KEY_PASSWORD repository secret" && exit 1)
          echo "$APTIDO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aptido-release.jks"

      - name: Build signed release APK
        env:
          GITHUB_USER: ${{ github.actor }}
          TRUST_WALLET_PACKAGES_TOKEN: ${{ secrets.TRUST_WALLET_PACKAGES_TOKEN }}
          APTIDO_KEYSTORE_PATH: ${{ runner.temp }}/aptido-release.jks
          APTIDO_KEYSTORE_PASSWORD: ${{ secrets.APTIDO_KEYSTORE_PASSWORD }}
          APTIDO_KEY_ALIAS: ${{ secrets.APTIDO_KEY_ALIAS }}
          APTIDO_KEY_PASSWORD: ${{ secrets.APTIDO_KEY_PASSWORD }}
        run: gradle -p apps/android-aptido :app:assembleRelease --no-daemon --stacktrace

      - name: Generate APK checksum
        run: sha256sum apps/android-aptido/app/build/outputs/apk/release/app-release.apk > apps/android-aptido/app/build/outputs/apk/release/app-release.apk.sha256

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: BALMZ AI APT ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/android-aptido/app/build/outputs/apk/release/app-release.apk
            apps/android-aptido/app/build/outputs/apk/release/app-release.apk.sha256
