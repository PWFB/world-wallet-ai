name: Settlement regression tests

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/settlement-tests.yml"
  push:
    branches:
      - main
      - fix/settlement-confirmations-reorg
    paths:
      - "services/api/**"
      - ".github/workflows/settlement-tests.yml"

jobs:
  settlement-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Run settlement regression tests
        working-directory: services/api
        run: python -m unittest discover -s tests -v
