name: World Wallet AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Compile API
        run: python -m py_compile services/api/main.py
      - name: Run API regression tests
        working-directory: services/api
        run: python -m unittest discover -s tests -v

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install dependencies
        run: npm install
      - name: Run network selection regression tests
        run: npm run test:network-selection
      - name: Run WalletConnect multi-chain account parsing tests
        run: npm run test:walletconnect-accounts
      - name: Run wallet security and multi-chain derivation tests
        run: npm run test:wallet-safety
      - name: Run wallet backup import tests
        run: npm run test:wallet-backups
      - name: Run in-app EVM signature verification tests
        run: npm run test:wallet-signatures
      - name: Run sidebar navigation regression tests
        run: npm run test:navigation
      - name: Build World Wallet web app
        run: npm run build
