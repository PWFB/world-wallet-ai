name: World Wallet AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: world_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_wallet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BALMZ_PRESALE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/world_wallet_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Compile API
        run: python -m py_compile services/api/main.py
      - name: Run API regression tests
        working-directory: services/api
        run: python -m unittest discover -s tests -v

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install dependencies
        run: npm install
      - name: Run network selection regression tests
        run: npm run test:network-selection
      - name: Run wallet security and multi-chain derivation tests
        run: npm run test:wallet-safety
      - name: Run wallet backup import tests
        run: npm run test:wallet-backups
      - name: Run in-app EVM signature verification tests
        run: npm run test:wallet-signatures
      - name: Run exact token amount formatting tests
        run: npm run test:token-amount
      - name: Run sidebar navigation regression tests
        run: npm run test:navigation
      - name: Build World Wallet web app
        run: npm run build
