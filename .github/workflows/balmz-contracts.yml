name: BALMZ Contract Checks

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/balmz-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - ".github/workflows/balmz-contracts.yml"

permissions:
  contents: read

jobs:
  hardhat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chain_id: [31337, 1, 56, 11155111]
    defaults:
      run:
        working-directory: contracts
    env:
      HARDHAT_CHAIN_ID: ${{ matrix.chain_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install contract dependencies
        run: npm ci
      - name: Compile BALMZ contracts
        run: npm run compile
      - name: Run BALMZ contract tests
        run: npm test
